<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockList PWA - V2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- Pantalla 1: Splash Screen -->
    <div id="splash" class="screen">
        <h1>RockList</h1>
        <p>Cargando amplificadores...</p>
    </div>

    <!-- Pantalla 2: Home Screen -->
    <div id="home" class="screen oculto">
        <header>
            <h2>Mi Setlist</h2>
            <span id="status" class="badge">Conectado</span>
        </header>

        <main>
            <!-- Punto 2.3: Control de Notificaciones -->
            <button id="btnNotificaciones" style="background-color: #555; margin-bottom: 15px;">
                Activar Notificaciones
            </button>

            <!-- Formulario de captura -->
            <form id="rockForm">
                <input type="text" id="song" placeholder="Canción (ej. Back in Black)" required>
                <input type="text" id="band" placeholder="Banda / Artista" required>
                
                <!-- Punto 2.4: Característica Física (Geolocalización) -->
                <button type="button" id="btnUbicacion" style="background-color: #007bff;">
                    Capturar mi ubicación actual
                </button>
                <small id="txtUbicacion" style="color: #ccc;">Ubicación no capturada</small>

                <button type="submit" style="margin-top: 10px;">Agregar al Setlist</button>
            </form>

            <button id="syncBtn" class="oculto">Sincronizar datos pendientes</button>

            <h3>Canciones Guardadas:</h3>
            <ul id="songList"></ul>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
