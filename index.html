<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RockList — Tu setlist de rock siempre contigo, online y offline.">
    <meta name="theme-color" content="#f5a623">
    <title>RockList PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Pantalla 1: Splash Screen -->
    <div id="splash" class="screen" role="status" aria-label="Cargando RockList">
        <h1>RockList</h1>
        <p>Cargando amplificadores...</p>
    </div>

    <!-- Pantalla 2: Home Screen -->
    <div id="home" class="screen oculto">

        <header role="banner">
            <h2>Mi Setlist</h2>
            <span id="status" class="badge" aria-live="polite">Conectado</span>
        </header>

        <main role="main">

            <!-- Notificaciones -->
            <button id="btnNotificaciones" class="btn-secondary" style="margin-bottom:16px;">
                🔔 Activar Notificaciones
            </button>

            <!-- Formulario de captura -->
            <form id="rockForm" novalidate>
                <h3>Agregar al Setlist</h3>

                <input type="text" id="song" placeholder="Canción (ej. Back in Black)" required autocomplete="off">
                <input type="text" id="band" placeholder="Banda / Artista" required autocomplete="off">

                <!-- Geolocalización -->
                <button type="button" id="btnUbicacion" class="btn-secondary">
                    📍 Capturar mi ubicación actual
                </button>
                <small id="txtUbicacion">Ubicación no capturada</small>

                <button type="submit">+ Agregar al Setlist</button>
            </form>

            <!-- Sincronización -->
            <button id="syncBtn" class="oculto btn-secondary" style="margin-bottom:16px;">
                ⟳ Sincronizar datos pendientes
            </button>

            <!-- Lista -->
            <p class="section-title">Canciones Guardadas</p>
            <ul id="songList" role="list" aria-label="Lista de canciones guardadas"></ul>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
